# إبقاء قاعدة البيانات نشطة
#
# الغرض: منصة السلف تُستخدم بشكل غير منتظم — قد تمر أيام دون دخول أحد.
# قاعدة البيانات (Supabase) على الخطة المجانية تتوقف تلقائياً بعد 7 أيام
# من عدم الاستخدام، فتظهر رسالة "تعذر الاتصال بقاعدة البيانات".
#
# هذه المهمة تفتح صفحة الفحص مرتين يومياً، وهي تُنفّذ استعلاماً بسيطاً على
# قاعدة البيانات — ما يُبقيها نشطة دائماً.
#
# طبقة احتياطية: توجد مهمة مماثلة في vercel.json تعمل يومياً.
# إن تعطّلت إحداهما تبقى الأخرى تعمل.
#
# تنبيه: GitHub يوقف المهام المجدولة تلقائياً إذا مرّ 60 يوماً دون أي تعديل
# على المستودع. مهمة Vercel لا تتأثر بهذا القيد.

name: Keep Database Alive

on:
  schedule:
    # 03:30 و 15:30 بتوقيت غرينتش يومياً (06:30 و 18:30 بتوقيت السعودية)
    - cron: '30 3 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch: # يسمح بالتشغيل اليدوي من صفحة Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: فحص قاعدة البيانات
        run: |
          echo "فحص https://solf-nif.vercel.app/api/health"

          # نحاول 3 مرات — أول محاولة قد تكون بطيئة إذا كانت القاعدة نائمة
          for attempt in 1 2 3; do
            echo "--- محاولة رقم $attempt ---"

            response=$(curl --silent --show-error --max-time 60 \
              --write-out "\nHTTP_CODE:%{http_code}" \
              https://solf-nif.vercel.app/api/health) || true

            echo "$response"

            code=$(echo "$response" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)

            if [ "$code" = "200" ]; then
              echo "✅ قاعدة البيانات نشطة وتعمل"
              exit 0
            fi

            echo "⚠️ لم تستجب بنجاح (الرمز: ${code:-لا يوجد}) — إعادة المحاولة بعد 30 ثانية"
            sleep 30
          done

          echo "❌ فشل الاتصال بقاعدة البيانات بعد 3 محاولات"
          echo "افتح لوحة Supabase وتحقق من حالة المشروع"
          exit 1
